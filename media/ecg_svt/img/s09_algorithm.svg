<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Алгоритм при НЖТ с узким QRS</title>
<rect width="960" height="540" rx="18" fill="#ffffff"/>
<text x="480.0" y="38.0" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Регулярная тахикардия с узким QRS: что делать (КР619_3)</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect x="330" y="60" width="300" height="70" rx="14" fill="#f8fafc" stroke="#1f2430" stroke-width="2.5"/>
<text x="346.0" y="88.0" font-size="17" fill="#1f2430" text-anchor="start" font-weight="bold">ЭКГ в 12 отведениях</text>
<text x="346.0" y="112.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">QRS ≤ 120 мс, ритм регулярный</text>
<line x1="400" y1="130" x2="210" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="268.0" y="140.0" font-size="13" fill="#6b7280" text-anchor="end" font-weight="bold">нестабилен</text>
<line x1="560" y1="130" x2="700" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="668.0" y="140.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">стабилен</text>
<rect x="40" y="175" width="330" height="110" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="56.0" y="203.0" font-size="17" fill="#d0342c" text-anchor="start" font-weight="bold">Синхронизированная ЭИТ</text>
<text x="56.0" y="227.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">гипотония, нарушение сознания,</text>
<text x="56.0" y="247.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">отёк лёгких, ангинозная боль</text>
<text x="56.0" y="267.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">нет ЭИТ на месте — СМП</text>
<rect x="560" y="175" width="360" height="86" rx="14" fill="#f8fafc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="576.0" y="203.0" font-size="17" fill="#2f6fb5" text-anchor="start" font-weight="bold">1. Вагусные приёмы</text>
<text x="576.0" y="227.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">лёжа, ноги подняты, 15–20 с</text>
<text x="576.0" y="247.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">проба Вальсальвы и другие</text>
<line x1="740" y1="261" x2="740" y2="282" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="284" width="360" height="86" rx="14" fill="#f8fafc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="576.0" y="312.0" font-size="17" fill="#2f6fb5" text-anchor="start" font-weight="bold">2. #Трифосаденин в/в болюсом</text>
<text x="576.0" y="336.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">10 мг за 2 с; через 2 мин — 20 мг</text>
<text x="576.0" y="356.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">нельзя: тяжёлая БА, стенокардия</text>
<line x1="740" y1="370" x2="740" y2="391" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="560" y="393" width="360" height="106" rx="14" fill="#f8fafc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="576.0" y="421.0" font-size="17" fill="#2f6fb5" text-anchor="start" font-weight="bold">3. Верапамил или метопролол</text>
<text x="576.0" y="445.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">верапамил 5–10 мг в/в за 2–3 мин</text>
<text x="576.0" y="465.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">метопролол 5 мг, повтор через 5 мин,</text>
<text x="576.0" y="485.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">всего 10–15 мг</text>
<rect x="40" y="330" width="470" height="150" rx="14" fill="#f8fafc" stroke="#e08a00" stroke-width="2.5"/>
<text x="56.0" y="358.0" font-size="17" fill="#e08a00" text-anchor="start" font-weight="bold">Не помогло или стало хуже</text>
<text x="56.0" y="382.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">синхронизированная ЭИТ (КР619_3)</text>
<text x="56.0" y="402.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">широкий QRS — верапамил не вводить</text>
<text x="56.0" y="422.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">после купирования: ЭКГ, актив или</text>
<text x="56.0" y="442.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">госпитализация, если приступ впервые</text>
<line x1="560" y1="446" x2="514" y2="420" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="480.0" y="528.0" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="normal">Дозы — КР619_3, приложение А3 · препараты — если есть в укладке</text>
</svg>
