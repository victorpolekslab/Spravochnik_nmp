<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Алгоритм при брадикардии</title>
<rect width="960" height="540" rx="18" fill="#ffffff"/>
<text x="480.0" y="36.0" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Брадикардия на вызове (КР160_2)</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect x="300" y="52" width="360" height="62" rx="14" fill="#f8fafc" stroke="#1f2430" stroke-width="2.5"/>
<text x="314.0" y="78.0" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">Брадикардия: ЭКГ в 12 отведениях</text>
<text x="314.0" y="100.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">есть симптомы? гемодинамика?</text>
<line x1="360" y1="114" x2="220" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="278.0" y="128.0" font-size="13" fill="#6b7280" text-anchor="end" font-weight="bold">нет симптомов</text>
<line x1="600" y1="114" x2="740" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="682.0" y="128.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">симптомы, гипотония</text>
<rect x="20" y="152" width="400" height="140" rx="14" fill="#f8fafc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="34.0" y="178.0" font-size="16" fill="#2f6fb5" text-anchor="start" font-weight="bold">Наблюдение, искать причину</text>
<text x="34.0" y="200.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">лекарства: β-блокаторы, верапамил,</text>
<text x="34.0" y="219.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">дилтиазем, гликозиды, антиаритмики</text>
<text x="34.0" y="238.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">калий, гипотиреоз, гипотермия, ИМ</text>
<text x="34.0" y="257.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">спортсмен без жалоб — норма</text>
<text x="34.0" y="276.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">впервые и с симптомами — к врачу</text>
<rect x="540" y="152" width="400" height="140" rx="14" fill="#f8fafc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="554.0" y="178.0" font-size="16" fill="#2e8b57" text-anchor="start" font-weight="bold">1. Атропин</text>
<text x="554.0" y="200.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">0,5–1 мг в/в</text>
<text x="554.0" y="219.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">повтор каждые 3–5 мин</text>
<text x="554.0" y="238.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">до максимальной дозы 3 мг</text>
<text x="554.0" y="257.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">лучше всего — при блокаде в АВ-узле</text>
<text x="554.0" y="276.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">и избытке тонуса вагуса</text>
<line x1="740" y1="292" x2="740" y2="316" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="750.0" y="309.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">нет эффекта</text>
<rect x="540" y="318" width="400" height="100" rx="14" fill="#f8fafc" stroke="#e08a00" stroke-width="2.5"/>
<text x="554.0" y="344.0" font-size="16" fill="#e08a00" text-anchor="start" font-weight="bold">2. #Допамин</text>
<text x="554.0" y="366.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">5–20 мкг/кг/мин в/в, начать с 5,</text>
<text x="554.0" y="385.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">+5 мкг/кг/мин каждые 2 мин</text>
<text x="554.0" y="404.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">при низкой вероятности ИБС</text>
<line x1="740" y1="418" x2="740" y2="440" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="540" y="442" width="400" height="80" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="554.0" y="468.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">3. Временная ЭКС — бригада СМП</text>
<text x="554.0" y="490.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">экстренная госпитализация с</text>
<text x="554.0" y="509.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">реанимацией и мониторингом</text>
<rect x="20" y="318" width="400" height="204" rx="14" fill="#f6f1fd" stroke="#7b4bb7" stroke-width="2.5"/>
<text x="34.0" y="344.0" font-size="16" fill="#7b4bb7" text-anchor="start" font-weight="bold">Симптомная брадикардия (КР160_2)</text>
<text x="34.0" y="366.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">обморок или предобморок</text>
<text x="34.0" y="385.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">головокружение, слабость</text>
<text x="34.0" y="404.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">признаки сердечной недостаточности</text>
<text x="34.0" y="423.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">спутанность сознания</text>
<text x="34.0" y="442.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">гипотония</text>
<text x="34.0" y="461.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="34.0" y="480.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">препараты — если есть в укладке</text>
</svg>
