<text x="763.7" y="144.0" font-size="13.5" fill="#e08a00" text-anchor="middle" font-weight="bold">…</text>
<rect x="779.6666666666667" y="196" width="108.3" height="28" rx="8" fill="#dbe7f5"/>
<text x="833.8" y="215.0" font-size="13" fill="#2f6fb5" text-anchor="middle" font-weight="bold">СЛР</text>
<line x1="406.6666666666667" y1="226" x2="406.6666666666667" y2="266" stroke="#d0342c" stroke-width="2.5"/>
<text x="406.7" y="286.0" font-size="15" fill="#d0342c" text-anchor="middle" font-weight="bold">амиодарон 300 мг</text>
<text x="406.7" y="306.0" font-size="15" fill="#7b4bb7" text-anchor="middle" font-weight="bold">+ #эпинефрин 1 мг</text>
<line x1="683.3333333333334" y1="226" x2="683.3333333333334" y2="266" stroke="#d0342c" stroke-width="2.5"/>
<text x="683.3" y="286.0" font-size="15" fill="#d0342c" text-anchor="middle" font-weight="bold">амиодарон 150 мг</text>
<text x="683.3" y="306.0" font-size="15" fill="#7b4bb7" text-anchor="middle" font-weight="bold">#эпинефрин — каждые 3–5 мин</text>
<rect x="40" y="340" width="430" height="150" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="54.0" y="366.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">Главное</text>
<text x="54.0" y="388.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">дефибрилляция — ключевой элемент СЛР</text>
<text x="54.0" y="407.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">лекарства не прерывают СЛР</text>
<text x="54.0" y="426.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">и не задерживают разряд</text>
<text x="54.0" y="445.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">нет амиодарона — лидокаин 1 мг/кг</text>
<text x="54.0" y="464.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">дефибриллятора нет — СЛР и вызов СМП</text>
<rect x="490" y="340" width="430" height="150" rx="14" fill="#f3f7fc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="504.0" y="366.0" font-size="16" fill="#2f6fb5" text-anchor="start" font-weight="bold">Асистолия и ЭМД</text>
<text x="504.0" y="388.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">ритм не для разряда</text>
<text x="504.0" y="407.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">#эпинефрин 1 мг — сразу</text>
<text x="504.0" y="426.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">после установки доступа,</text>
<text x="504.0" y="445.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">далее каждые 3–5 мин</text>
<text x="504.0" y="464.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">препараты — если есть в укладке</text>
