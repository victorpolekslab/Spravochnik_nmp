# Template, substitute approved VPN range, domain and certificates.
limit_req_zone $binary_remote_addr zone=medical_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=medical_login:10m rate=5r/m;
limit_req_zone $server_name zone=medical_total:1m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=medical_conn:10m;
upstream medical_pilot {
    server 127.0.0.1:8766;
    server 127.0.0.1:8767;
}
server {
    listen 10.70.0.10:443 ssl;
    server_name pilot.example.invalid;
    ssl_certificate /run/medical-tls/fullchain.pem;
    ssl_certificate_key /run/medical-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($host != pilot.example.invalid) { return 421; }
    allow 10.70.10.0/24;
    deny all;
    access_log off;
    error_log /var/log/nginx/medical-pilot.log crit;
    client_max_body_size 32k;
    client_header_timeout 5s;
    large_client_header_buffers 2 8k;
    client_body_timeout 5s;
    limit_conn medical_conn 8;
    limit_req_status 429;
    proxy_set_header Host pilot.example.invalid;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_read_timeout 5s;
    proxy_connect_timeout 1s;
    proxy_next_upstream off;
    location ~ ^/v1/(nmp|terapevt)/auth/login$ {
        limit_req zone=medical_total burst=8 nodelay;
        limit_req zone=medical_login burst=2 nodelay;
        proxy_pass http://medical_pilot;
    }
    location / {
        limit_req zone=medical_total burst=8 nodelay;
        limit_req zone=medical_ip burst=8 nodelay;
        proxy_pass http://medical_pilot;
    }
}
