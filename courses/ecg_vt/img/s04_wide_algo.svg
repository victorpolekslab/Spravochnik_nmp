<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Алгоритм при тахикардии с широкими QRS</title>
<rect width="960" height="540" rx="18" fill="#ffffff"/>
<text x="480.0" y="36.0" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Тахикардия с широкими QRS на вызове (КР569_2)</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect x="300" y="52" width="360" height="62" rx="14" fill="#f8fafc" stroke="#1f2430" stroke-width="2.5"/>
<text x="314.0" y="78.0" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">Широкие QRS, ЧСС &gt; 100</text>
<text x="314.0" y="100.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">пульс есть? гемодинамика?</text>
<line x1="330" y1="114" x2="200" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="250.0" y="128.0" font-size="13" fill="#6b7280" text-anchor="end" font-weight="bold">нет пульса</text>
<line x1="480" y1="114" x2="480" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="494.0" y="138.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">нестабильна</text>
<line x1="630" y1="114" x2="760" y2="150" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="712.0" y="128.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="bold">стабильна</text>
<rect x="20" y="152" width="290" height="112" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="34.0" y="178.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">Остановка</text>
<text x="34.0" y="200.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ФЖ или ЖТ без пульса:</text>
<text x="34.0" y="219.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">СЛР и дефибрилляция</text>
<text x="34.0" y="238.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">немедленно</text>
<rect x="330" y="152" width="290" height="112" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="344.0" y="178.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">Кардиоверсия</text>
<text x="344.0" y="200.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">гипотония, обморок, ишемия,</text>
<text x="344.0" y="219.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">отёк лёгких; нет ЭИТ —</text>
<text x="344.0" y="238.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">бригада СМП</text>
<rect x="640" y="152" width="300" height="112" rx="14" fill="#f8fafc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="654.0" y="178.0" font-size="16" fill="#2f6fb5" text-anchor="start" font-weight="bold">ЭКГ в 12 отведениях</text>
<text x="654.0" y="200.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">считать ЖТ, пока не доказана</text>
<text x="654.0" y="219.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">НЖТ; верапамил — нельзя</text>
<line x1="700" y1="264" x2="600" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="880" y1="264" x2="880" y2="300" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="380" y="302" width="290" height="124" rx="14" fill="#f8fafc" stroke="#2e8b57" stroke-width="2.5"/>
<text x="394.0" y="328.0" font-size="16" fill="#2e8b57" text-anchor="start" font-weight="bold">НЖТ несомненна</text>
<text x="394.0" y="350.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">вагусные пробы;</text>
<text x="394.0" y="369.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">не помогли — #трифосаденин</text>
<text x="394.0" y="388.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">по КР619_3</text>
<rect x="690" y="302" width="250" height="124" rx="14" fill="#f8fafc" stroke="#e08a00" stroke-width="2.5"/>
<text x="704.0" y="328.0" font-size="16" fill="#e08a00" text-anchor="start" font-weight="bold">ЖТ или неясно</text>
<text x="704.0" y="350.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">#прокаинамид, если нет</text>
<text x="704.0" y="369.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">тяжёлой СН, гипотонии,</text>
<text x="704.0" y="388.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">острого ИМ;</text>
<text x="704.0" y="407.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">иначе — #амиодарон</text>
<rect x="20" y="302" width="340" height="124" rx="14" fill="#f6f1fd" stroke="#7b4bb7" stroke-width="2.5"/>
<text x="34.0" y="328.0" font-size="16" fill="#7b4bb7" text-anchor="start" font-weight="bold">Нерегулярная и широкая</text>
<text x="34.0" y="350.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ФП + WPW: не вводить</text>
<text x="34.0" y="369.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">#трифосаденин, β-блокаторы,</text>
<text x="34.0" y="388.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">верапамил, дигоксин, амиодарон</text>
<rect x="20" y="442" width="920" height="80" rx="14" fill="#fff8eb" stroke="#e08a00" stroke-width="1.5"/>
<text x="40.0" y="470.0" font-size="16" fill="#e08a00" text-anchor="start" font-weight="bold">Частая ошибка: «давление нормальное — значит, НЖТ»</text>
<text x="40.0" y="496.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">Стабильная гемодинамика не исключает ЖТ. Препараты от ЖТ помогают и при НЖТ, а верапамил при ЖТ</text>
<text x="40.0" y="514.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">может уронить давление (КР569_2). Препараты — если есть в укладке.</text>
</svg>
