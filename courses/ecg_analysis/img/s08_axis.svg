<text x="650.0" y="216.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">норма, гориз., верт.</text>
<circle cx="560" cy="258" r="16" fill="#2e8b57" opacity="0.18"/>
<text x="560.0" y="265.0" font-size="22" fill="#2e8b57" text-anchor="middle" font-weight="bold">+</text>
<circle cx="610" cy="258" r="16" fill="#d0342c" opacity="0.18"/>
<text x="610.0" y="265.0" font-size="22" fill="#d0342c" text-anchor="middle" font-weight="bold">−</text>
<text x="650.0" y="256.0" font-size="15" fill="#2f6fb5" text-anchor="start" font-weight="bold">меньше 0°</text>
<text x="650.0" y="278.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">влево</text>
<circle cx="560" cy="320" r="16" fill="#d0342c" opacity="0.18"/>
<text x="560.0" y="327.0" font-size="22" fill="#d0342c" text-anchor="middle" font-weight="bold">−</text>
<circle cx="610" cy="320" r="16" fill="#2e8b57" opacity="0.18"/>
<text x="610.0" y="327.0" font-size="22" fill="#2e8b57" text-anchor="middle" font-weight="bold">+</text>
<text x="650.0" y="318.0" font-size="15" fill="#d0342c" text-anchor="start" font-weight="bold">больше +90°</text>
<text x="650.0" y="340.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">вправо</text>
<circle cx="560" cy="382" r="16" fill="#d0342c" opacity="0.18"/>
<text x="560.0" y="389.0" font-size="22" fill="#d0342c" text-anchor="middle" font-weight="bold">−</text>
<circle cx="610" cy="382" r="16" fill="#d0342c" opacity="0.18"/>
<text x="610.0" y="389.0" font-size="22" fill="#d0342c" text-anchor="middle" font-weight="bold">−</text>
<text x="650.0" y="380.0" font-size="15" fill="#7b4bb7" text-anchor="start" font-weight="bold">резко отклонена</text>
<text x="650.0" y="402.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">проверить электроды</text>
<text x="538.0" y="452.0" font-size="13" fill="#6b7280" text-anchor="start" font-weight="normal">«+» — R больше S, «−» — S больше R</text>
<text x="480.0" y="532.0" font-size="13.5" fill="#6b7280" text-anchor="middle" font-weight="normal">Нормальная +30…+69° · вертикальная +70…+90° · горизонтальная 0…+29° (пособие, гл. 4)</text>
</svg>
