125,290" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 226,375 C 215,395 240,410 255,415" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 226,375 C 180,385 140,350 108,262" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 382,222 C 395,250 398,285 392,320" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 320,402 C 345,395 370,372 386,345" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 320,402 C 300,415 282,420 268,424" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 300,330 C 330,325 360,300 378,270" fill="none" stroke="#f2b705" stroke-width="2.2" stroke-linecap="round" opacity="1"/><path d="M 246,228 C 238,280 232,330 226,375" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 246,228 L 258,250" fill="none" stroke="#f2b705" stroke-width="6" stroke-linecap="round" opacity="1"/><path d="M 258,250 C 300,250 345,240 382,222" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 258,250 C 275,310 300,360 320,402" fill="none" stroke="#f2b705" stroke-width="5" stroke-linecap="round" opacity="1"/><path d="M 238,192 L 246,228" fill="none" stroke="#f2b705" stroke-width="6.5" stroke-linecap="round" opacity="1"/><circle cx="118" cy="92" r="10" fill="#ff9f1c" stroke="#fff" stroke-width="2.5" opacity="1"/><ellipse cx="238" cy="192" rx="12" ry="8" fill="#ff9f1c" stroke="#fff" stroke-width="2.5" opacity="1"/></g><g><ellipse cx="520" cy="316" rx="15" ry="10" fill="#fff" stroke="#2f6db5" stroke-width="2.2"/><circle cx="520" cy="316" r="5" fill="#2f6db5"/></g><text x="538" y="321" font-size="15" fill="#2f6db5" text-anchor="start" font-weight="bold">I</text><g><ellipse cx="520" cy="206" rx="15" ry="10" fill="#fff" stroke="#2f6db5" stroke-width="2.2"/><circle cx="520" cy="206" r="5" fill="#2f6db5"/></g><text x="538" y="211" font-size="15" fill="#2f6db5" text-anchor="start" font-weight="bold">aVL</text><g><ellipse cx="457" cy="488" rx="15" ry="10" fill="#fff" stroke="#d0342c" stroke-width="2.2"/><circle cx="457" cy="488" r="5" fill="#d0342c"/></g><text x="475" y="493" font-size="15" fill="#d0342c" text-anchor="start" font-weight="bold">II</text><g><ellipse cx="330" cy="488" rx="15" ry="10" fill="#fff" stroke="#d0342c" stroke-width="2.2"/><circle cx="330" cy="488" r="5" fill="#d0342c"/></g><text x="348" y="493" font-size="15" fill="#d0342c" text-anchor="start" font-weight="bold">aVF</text><g><ellipse cx="202" cy="488" rx="15" ry="10" fill="#fff" stroke="#d0342c" stroke-width="2.2"/><circle cx="202" cy="488" r="5" fill="#d0342c"/></g><text x="184" y="493" font-size="15" fill="#d0342c" text-anchor="end" font-weight="bold">III</text><g><ellipse cx="109" cy="206" rx="15" ry="10" fill="#fff" stroke="#6b7280" stroke-width="2.2"/><circle cx="109" cy="206" r="5" fill="#6b7280"/></g><text x="91" y="211" font-size="15" fill="#6b7280" text-anchor="end" font-weight="bold">aVR</text><text x="30" y="64" font-size="12.5" fill="#6b7280" text-anchor="start" font-weight="normal">От конечностей — во фронтальной плоскости:</text><text x="560" y="64" font-size="13" fill="#1f2430" text-anchor="start" font-weight="bold">Грудные отведения — срез сверху вниз</text><g transform="translate(560,52) scale(0.93)"><ellipse cx="200" cy="165" rx="185" ry="125" fill="#f3efe7" stroke="#cfc6b4" stroke-width="2"/><text x="200" y="276" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">спина</text><rect x="182" y="42" width="36" height="16" rx="5" fill="#ddd5c6"/><text x="200" y="72" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="normal">грудина</text><path d="M 180,155 C 134,135 160,79 230,103 C 200,127 184,135 180,155 Z" fill="#f0b3a8" stroke="#c0766b" stroke-width="2"/><circle cx="240" cy="175" r="53.0" fill="none" stroke="#eaa093" stroke-width="26"/><circle cx="240" cy="175" r="66" fill="none" stroke="#b5655a" stroke-width="2"/><circle cx="240" cy="175" r="40" fill="#fbe9e4" stroke="#b5655a" stroke-width="1.5"/><text x="240" y="180" font-size="14" fill="#8a4a40" text-anchor="middle" font-weight="bold">ЛЖ</text><text x="166" y="113" font-size="13" fill="#9b5a50" text-anchor="middle" font-weight="bold">ПЖ</text><ellipse cx="150" cy="50" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="150" cy="50" r="3.6" fill="#2f6db5"/><text x="150" y="38" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V1</text><ellipse cx="205" cy="42" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="205" cy="42" r="3.6" fill="#2f6db5"/><text x="205" y="30" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V2</text><ellipse cx="262" cy="52" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="262" cy="52" r="3.6" fill="#2f6db5"/><text x="262" y="40" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V3</text><ellipse cx="318" cy="82" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="318" cy="82" r="3.6" fill="#2f6db5"/><text x="318" y="70" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V4</text><ellipse cx="362" cy="128" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="362" cy="128" r="3.6" fill="#2f6db5"/><text x="362" y="116" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V5</text><ellipse cx="382" cy="185" rx="11" ry="7.5" fill="#fff" stroke="#2f6db5" stroke-width="2"/><circle cx="382" cy="185" r="3.6" fill="#2f6db5"/><text x="382" y="173" font-size="12.5" fill="#2f6db5" text-anchor="middle" font-weight="bold">V6</text></g><text x="560" y="346.0" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="bold">Возбуждение идёт к электроду →</text><text x="560" y="364.225" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="bold">зубец вверх; от электрода — вниз.</text><text x="560" y="394.4" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">II, III, aVF смотрят снизу — нижняя</text><text x="560" y="412.625" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">стенка; I, aVL, V5–V6 — боковая;</text><text x="560" y="430.84999999999997" font-size="13.5" fill="#1f2430" text-anchor="start" font-weight="normal">V1–V4 — перегородка и передняя.</text><text x="560" y="461.0" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="normal">Перепутали электроды — «глаз»</text><text x="560" y="479.225" font-size="13.5" fill="#6b7280" text-anchor="start" font-weight="normal">смотрит не туда, ЭКГ лжёт.</text><text x="480.0" y="526" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">Схема учебная · пособие, гл. 2</text></svg>