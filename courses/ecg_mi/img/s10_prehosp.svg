<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
<title>ОКС на вызове</title>
<rect width="960" height="540" rx="18" fill="#ffffff"/>
<text x="480.0" y="34.0" font-size="19" fill="#1f2430" text-anchor="middle" font-weight="bold">ОКС на вызове: алгоритм КР для фельдшера (адаптировано к укладке НМП)</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect x="20" y="50" width="920" height="104" rx="14" fill="#f8fafc" stroke="#1f2430" stroke-width="2.5"/>
<text x="34.0" y="76.0" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">Всем с подозрением на ОКС (КР157_5, прил. Б4; КР154_4, прил. Б2)</text>
<text x="34.0" y="98.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">жалобы, анамнез, АД, ЧСС · ограничить активность · ЭКГ в 12 отведениях ≤ 10 мин, телемедицина ·</text>
<text x="34.0" y="117.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">мониторинг ЭКГ, венозный доступ, готовность к СЛР · вызвать бригаду СМП · время начала боли в карту</text>
<rect x="20" y="170" width="450" height="190" rx="14" fill="#fff8eb" stroke="#e08a00" stroke-width="2.5"/>
<text x="34.0" y="196.0" font-size="16" fill="#e08a00" text-anchor="start" font-weight="bold">Боль</text>
<text x="34.0" y="218.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">нитроглицерин 0,4–0,5 мг под язык</text>
<text x="34.0" y="237.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">или спрей при отсутствии гипотонии;</text>
<text x="34.0" y="256.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">повтор через 5 мин, контроль АД</text>
<text x="34.0" y="275.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">нельзя: гипотония, ИМ правого</text>
<text x="34.0" y="294.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">желудочка, силденафил ≤ 24 ч, тадалафил ≤ 48 ч</text>
<text x="34.0" y="313.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">боль сохраняется — нужен наркотический</text>
<text x="34.0" y="332.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">анальгетик: бригада СМП</text>
<rect x="490" y="170" width="450" height="190" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="504.0" y="196.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">Антиагреганты</text>
<text x="504.0" y="218.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">АСК 150–300 мг разжевать</text>
<text x="504.0" y="237.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">(не кишечнорастворимую), если нет</text>
<text x="504.0" y="256.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">противопоказаний</text>
<text x="504.0" y="275.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ОКСпST, стратегия ЧКВ — возможен</text>
<text x="504.0" y="294.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">клопидогрел 600 мг (не обязателен)</text>
<text x="504.0" y="313.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ОКСбпST: клопидогрел и гепарин</text>
<text x="504.0" y="332.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">не рекомендуются</text>
<rect x="20" y="376" width="450" height="150" rx="14" fill="#f8fafc" stroke="#6b7280" stroke-width="2.5"/>
<text x="34.0" y="402.0" font-size="16" fill="#6b7280" text-anchor="start" font-weight="bold">Не делать</text>
<text x="34.0" y="424.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">кислород — только при SpO2 &lt; 90 %</text>
<text x="34.0" y="443.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">(в укладке НМП нет — бригада СМП)</text>
<text x="34.0" y="462.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">гепарин без тромболизиса —</text>
<text x="34.0" y="481.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">не рекомендуется</text>
<text x="34.0" y="500.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">в/в β-блокаторы при гипотонии, ИМ ПЖ</text>
<rect x="490" y="376" width="450" height="146" rx="14" fill="#f3f7fc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="504.0" y="402.0" font-size="16" fill="#2f6fb5" text-anchor="start" font-weight="bold">Маршрут</text>
<text x="504.0" y="424.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">экстренно — в стационар системы ОКС,</text>
<text x="504.0" y="443.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">лучше с ЧКВ; предупредить стационар</text>
<text x="504.0" y="462.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ЧКВ ≤ 120 мин от диагноза ОКСпST</text>
<text x="504.0" y="481.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">или транспортировка ≤ 60 мин</text>
</svg>
