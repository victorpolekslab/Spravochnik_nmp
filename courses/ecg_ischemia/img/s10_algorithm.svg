<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="DejaVu Sans, Arial, sans-serif">
<title>Алгоритм ЭКГ при боли в груди</title>
<rect width="960" height="540" rx="18" fill="#ffffff"/>
<text x="480.0" y="36.0" font-size="22" fill="#1f2430" text-anchor="middle" font-weight="bold">Боль в груди: ЭКГ на вызове (КР157_5, КР154_4)</text>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7280"/></marker></defs>
<rect x="280" y="52" width="400" height="78" rx="14" fill="#f8fafc" stroke="#1f2430" stroke-width="2.5"/>
<text x="294.0" y="78.0" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">ЭКГ в 12 отведениях ≤ 10 мин</text>
<text x="294.0" y="100.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">от первого контакта; трудно трактовать —</text>
<text x="294.0" y="119.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">телемедицина</text>
<line x1="330" y1="130" x2="160" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="480" y1="130" x2="480" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="630" y1="130" x2="800" y2="170" stroke="#6b7280" stroke-width="2.5" marker-end="url(#ar)"/>
<rect x="20" y="172" width="290" height="160" rx="14" fill="#fdf2f2" stroke="#d0342c" stroke-width="2.5"/>
<text x="34.0" y="198.0" font-size="16" fill="#d0342c" text-anchor="start" font-weight="bold">ОКС с подъёмом ST</text>
<text x="34.0" y="220.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">стойкий подъём ST &gt; 20 мин</text>
<text x="34.0" y="239.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">в 2 смежных по критериям</text>
<text x="34.0" y="258.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">или новая БЛНПГ</text>
<text x="34.0" y="277.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="34.0" y="296.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">маршрут ОКСпST</text>
<rect x="335" y="172" width="290" height="160" rx="14" fill="#fff8eb" stroke="#e08a00" stroke-width="2.5"/>
<text x="349.0" y="198.0" font-size="16" fill="#e08a00" text-anchor="start" font-weight="bold">ОКС без подъёма ST</text>
<text x="349.0" y="220.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">депрессия ST ≥ 0,5 мм</text>
<text x="349.0" y="239.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">инверсия T &gt; 1 мм</text>
<text x="349.0" y="258.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">преходящий подъём ST</text>
<text x="349.0" y="277.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal"></text>
<text x="349.0" y="296.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">маршрут ОКСбпST</text>
<rect x="650" y="172" width="290" height="160" rx="14" fill="#f3f7fc" stroke="#2f6fb5" stroke-width="2.5"/>
<text x="664.0" y="198.0" font-size="16" fill="#2f6fb5" text-anchor="start" font-weight="bold">ЭКГ без изменений</text>
<text x="664.0" y="220.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">ОКС не исключён!</text>
<text x="664.0" y="239.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">V7–V9, V3R–V4R</text>
<text x="664.0" y="258.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">повтор ЭКГ каждые 15–30 мин</text>
<text x="664.0" y="277.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">при сохранении боли</text>
<text x="664.0" y="296.0" font-size="13.3" fill="#1f2430" text-anchor="start" font-weight="normal">сравнить со старой ЭКГ</text>
<rect x="20" y="352" width="920" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40.0" y="380.0" font-size="16" fill="#1f2430" text-anchor="start" font-weight="bold">Что важно</text>
<text x="40.0" y="408.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">• ЭКГ во время боли информативнее, чем после неё (КР155_2)</text>
<text x="40.0" y="434.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">• смотрите аритмии и блокады: они меняют лечение (КР154_4, прил. А3)</text>
<text x="40.0" y="460.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">• подъём ST бывает не только при ИМ: ранняя реполяризация, перикардит, ГЛЖ, БЛНПГ — часть 13</text>
<text x="40.0" y="486.0" font-size="14" fill="#1f2430" text-anchor="start" font-weight="normal">• лечение и маршрутизация при ОКС — часть 11</text>
</svg>
