name: Medical Platform isolated integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integration/medical-platform/**'
      - '.github/workflows/medical-platform-integration.yml'
permissions:
  contents: read
jobs:
  ydb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MEDICAL_YDB_LOCAL_PORT: '32136'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: integration/medical-platform:integration/medical-platform/testdeps
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ydb==3.35.0 argon2-cffi==25.1.0
      - run: |
          docker run -d --name medical-ydb --hostname localhost -p 127.0.0.1:32136:2136 \
            -e GRPC_PORT=2136 -e YDB_GRPC_ENABLE_TLS=false -e YDB_USE_IN_MEMORY_PDISKS=true ydbplatform/local-ydb:26.2.1.16
          docker inspect --format '{{.Image}}' medical-ydb
          python - <<'PY'
          import ydb
          with ydb.Driver(endpoint="grpc://127.0.0.1:32136", database="/local",
                          credentials=ydb.AnonymousCredentials(), disable_discovery=True) as driver:
              driver.wait(timeout=120, fail_fast=False)
          PY
      - run: python -m unittest -v 05_test_ydb 05_test_registration 06_test_ydb 07_test_gateway 072_test_ydb
      - if: always()
        run: |
          docker ps -a --filter name=medical-ydb
          docker logs --tail 200 medical-ydb || true
          docker rm -f medical-ydb || true
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: integration/medical-platform:integration/medical-platform/testdeps
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          npm install --prefix "$RUNNER_TEMP/medical-test" --no-audit --no-fund playwright@1.57.0
          export NODE_PATH="$RUNNER_TEMP/medical-test/node_modules"
          "$RUNNER_TEMP/medical-test/node_modules/.bin/playwright" install --with-deps chromium
          export CHROMIUM="$(node -p 'require("playwright").chromium.executablePath()')"
          "$CHROMIUM" --version
          node --test integration/medical-platform/071_test_browser.cjs
