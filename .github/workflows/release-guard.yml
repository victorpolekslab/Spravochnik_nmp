name: Проверка подготовки публикации
on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - '.github/workflows/release-guard.yml'
      - 'tools/release_content.sh'
      - 'tools/ci_ota.py'
      - 'tools/build_ota.py'
      - 'web/build.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Проверка shell и Python
        run: |
          sh -n tools/release_content.sh
          python3 -m py_compile tools/ci_ota.py tools/build_ota.py web/build.py
      - name: Проверка запрета прямой публикации
        run: |
          python3 - <<'PY'
          from pathlib import Path
          release = Path('tools/release_content.sh').read_text()
          commands = '\n'.join(line.strip() for line in release.splitlines() if line.strip() and not line.lstrip().startswith('#'))
          import re
          assert not re.search(r'\\bgit\\s+push\\b', commands), 'Release preparation must not push'
          assert not re.search(r'\\b(?:python3?|sh|bash)\\s+[^\\n]*build_ota\\.py\\b', commands), 'Release preparation must not sign OTA'
          pages = Path('.github/workflows/pages.yml').read_text()
          assert 'branches: [main, apk, drugs]' in pages, 'Existing APK/drugs mirrors must keep working until branch rules are configured'
          assert 'workflow_dispatch:' in pages, 'Manual deployment must remain possible'
          print('Release guard checks passed')
          PY
