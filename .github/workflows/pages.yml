name: Публикация веб-версии

on:
  push:
    branches: [main, apk, drugs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Сборка
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          python3 build.py
          cp ../learn/learn.json dist/learn.json
          cp -r ../media dist/media
      - name: Обновление содержимого для Android (OTA)
        continue-on-error: true   # ошибка подписи не должна мешать публикации веб-версии
        env:
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          # файлы www + подписанный манифест; новая подпись — только если файлы изменились (ключ — секрет OTA_KEY_PEM)
          pip install --quiet cryptography
          python3 tools/ci_ota.py web/dist
      - name: Android-приложение (ветка apk)
        run: |
          if git fetch --depth=1 origin apk; then
            mkdir -p web/dist/download
            git show FETCH_HEAD:SpravochnikNMP.apk > web/dist/download/SpravochnikNMP.apk
            git show FETCH_HEAD:android.json > web/dist/android.json
          fi
      - name: Данные препаратов (зеркало ветки drugs)
        run: |
          # raw.githubusercontent.com у части операторов недоступен — приложения берут данные отсюда, raw — запасной путь
          if git fetch --depth=1 origin drugs; then
            mkdir -p web/dist/drugs
            git archive FETCH_HEAD app | tar -x -C web/dist/drugs
          fi
      - name: Сборка подписанного офлайн-пакета препаратов
        env:
          OTA_KEY_PEM: ${{ secrets.OTA_KEY_PEM }}
        run: |
          if [ -z "$OTA_KEY_PEM" ]; then
            echo "::warning::No OTA signing key; offline drug package not published"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/drugs-source"
          git fetch --depth=1 origin drugs
          git archive FETCH_HEAD app | tar -x -C "$RUNNER_TEMP/drugs-source"
          python3 tools/package_drugs.py --source "$RUNNER_TEMP/drugs-source/app" --out web/dist/drugs-package
          pip install --quiet cryptography
          printf '%s\n' "$OTA_KEY_PEM" > "$RUNNER_TEMP/drugs-signing-key.pem"
          python3 - <<'PY'
          import base64, os, pathlib
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          p = pathlib.Path("web/dist/drugs-package")
          key = serialization.load_pem_private_key(pathlib.Path(os.environ["RUNNER_TEMP"], "drugs-signing-key.pem").read_bytes(), password=None)
          data = (p / "drugs-manifest.json").read_bytes()
          (p / "drugs-manifest.sig").write_bytes(base64.b64encode(key.sign(data, ec.ECDSA(hashes.SHA256()))) + b"\n")
          PY
          rm -f "$RUNNER_TEMP/drugs-signing-key.pem"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
